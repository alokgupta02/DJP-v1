# Spring Boot Configuration: Test Profile (application-test.yml)
# Uses embedded H2 database for fast, isolated tests

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:djptest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data/users.sql
        - classpath:data/issues.sql
        - classpath:data/discussions.sql
        - classpath:data/polls.sql

app:
  persistence:
    sql-file:
      enabled: false
  jwt:
    secret: "testSecretKeyThatIsAtLeast256BitsLongForTestingPurposesOnly"
    expiration-ms: 3600000
  cors:
    allowed-origins: "http://localhost:5173"

logging:
  level:
    com.djp.backend: DEBUG
    org.springframework.test: DEBUG
    org.hibernate.SQL: DEBUG