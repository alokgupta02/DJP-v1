# Spring Boot Configuration: Local Embedded H2 Database Profile
# To activate: --spring.profiles.active=h2

spring:
  datasource:
    url: jdbc:h2:mem:djpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
