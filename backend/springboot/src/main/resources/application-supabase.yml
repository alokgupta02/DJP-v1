# Spring Boot Configuration: Supabase PostgreSQL Profile
# To activate: --spring.profiles.active=supabase

spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST:db.yourproject.supabase.co}:5432/postgres?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_USER:postgres}
    password: ${SUPABASE_PASSWORD:secret-password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
