# Spring Boot Configuration: Common Base Configuration (application.yml)
# Active profile defaults to 'local' for embedded H2 database dev mode.
# Override via command line: --spring.profiles.active=prod

spring:
  profiles:
    active: local
  application:
    name: backend

# Resilience4j Circuit Breaker & Retry Configurations
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      authServiceCB:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      authServiceRetry:
        baseConfig: default
