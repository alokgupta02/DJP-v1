# Spring Boot Configuration: Production Profile (application-prod.yml)
# Active in production: --spring.profiles.active=prod

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}  # Fail startup if secret password env var is missing
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  h2:
    console:
      enabled: false  # Hard disable console in production
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Safety guard: never drop/update schemas automatically
    show-sql: false

# Enforce JWT_SECRET env var is provided in production
app:
  jwt:
    secret: ${JWT_SECRET} # Startup will fail if JWT_SECRET is not provided
