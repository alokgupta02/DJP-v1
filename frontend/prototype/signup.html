<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif;}

body{
background:#f5f6f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:460px;
background:white;
padding:40px;
border-radius:8px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
font-size:30px;
color:#333;
margin-bottom:8px;
}

p{
color:#777;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:16px;
border:1px solid #e8ecf1;
border-radius:6px;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.primary{
background:#a31621;
color:white;
margin-top:8px;
}

.footer{
margin-top:20px;
text-align:center;
color:#777;
}

a{
color:#a31621;
text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

<h1>Create Account</h1>
<p>Join the platform</p>

<input placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">

<button class="primary">
Continue
</button>

<div class="footer">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

</body>
</html>
