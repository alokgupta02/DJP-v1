<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Digital Janta</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif;}

body{
background:#f5f6f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:420px;
background:#fff;
padding:40px;
border-radius:8px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
font-size:30px;
color:#333;
margin-bottom:8px;
}

p{
color:#777;
margin-bottom:30px;
}

.input-group{
position:relative;
margin-bottom:16px;
}

.input-group svg{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
width:18px;
height:18px;
fill:#999;
pointer-events:none;
}

input{
width:100%;
padding:14px 14px 14px 44px;
border:1px solid #e8ecf1;
border-radius:6px;
font-size:15px;
outline:none;
transition:border-color .2s;
}

input:focus{
border-color:#ff6b5b;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.login{
background:#ff6b5b;
color:#fff;
margin-bottom:18px;
transition:background .2s;
}

.login:hover{
background:#e85a4b;
}

.social{
background:#fff;
border:1px solid #ddd;
margin-bottom:12px;
color:#333;
transition:background .2s;
}

.social:hover{
background:#f9f9f9;
}

.divider{
text-align:center;
margin:20px 0;
color:#999;
font-size:14px;
}

.footer{
text-align:center;
margin-top:20px;
font-size:14px;
color:#777;
}

a{
color:#ff6b5b;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}
</style>
</head>

<body>

<div class="card">

<h1>Welcome Back</h1>
<p>Login to continue</p>

<div class="input-group">
<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 
0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
<input type="email" placeholder="Email">
</div>

<div class="input-group">
<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
<input type="password" placeholder="Password">
</div>

<button class="login">
<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
Login
</button>

<div class="divider">OR</div>

<button class="social">
<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 15.04 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>

Continue with GitHub
</button>

<div class="footer">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</div>

</body>
</html>
