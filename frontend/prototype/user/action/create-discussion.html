<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>DJ - Create Discussion</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--p:#a31621;--b:#e5e7eb}*{box-sizing:border-box;font-family:'Noto Sans',sans-serif}
body{margin:0;background:#f5f6f8;padding:40px}.c{max-width:850px;margin:auto}.brand{text-align:center}.brand h1{color:var(--p)}
.card{background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}.top{height:8px;background:var(--p)}
.s{padding:24px;border-bottom:1px solid var(--b)}label{display:block;font-weight:600;margin:8px 0}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--b);border-radius:8px}textarea{min-height:130px}
button{background:var(--p);color:#fff;border:none;padding:14px 18px;border-radius:8px;font-weight:700}
.note{background:#fff4f4;border: 1px solid #e7bdb4;padding:12px}
</style></head><body><div class='c'><div class='brand'><h1>Digital Janata</h1><p>Start a Civic Discussion</p></div>
<div class='card'><div class='top'></div>
<div class='s'><h3>Discussion Category</h3>
<label>Category *</label><select><option>Infrastructure</option><option>Education</option><option>Healthcare</option><option>Governance</option><option>Environment</option><option>Economy</option><option>Other</option></select>
</div>
<div class='s'><h3>Title</h3><label>Discussion Title *</label><input placeholder='Example: Should our ward prioritize road repairs over beautification?'></div>
<div class='s'><h3>Your Discussion</h3><label>Body *</label><textarea placeholder='Share your thoughts, context and invite constructive discussion...'></textarea></div>
<div class='s'><h3>Objective</h3><label>What do you want from this discussion?</label><select><option>Gather opinions</option><option>Find solutions</option><option>Raise awareness</option><option>Ask a question</option><option>Policy discussion</option></select></div>
<div class='s'><h3>Geographic Scope</h3><label>Discussion applies to</label><select><option>My Ward</option><option>My City</option><option>District</option><option>State</option><option>Nationwide</option></select></div>
<div class='s'><h3>Supporting Material</h3><input type='file' multiple></div>
<div class='s'><h3>Tags</h3><input placeholder='roads, traffic, municipality'></div>
<div class='s'><h3>Visibility</h3><select><option>Public</option><option>Anonymous</option></select></div>
<div class='s'><h3>Similar Discussions</h3><div class='note'>🤖 Similar discussions will be suggested before publishing.</div></div>
<div class='s' style='text-align:right'><button>Publish Discussion</button></div>
</div></div></body></html>
