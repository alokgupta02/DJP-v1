
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ - Create Poll</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#BB0311;--border:#e5e7eb;}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#f5f6f8;padding:40px}
.container{max-width:850px;margin:auto}
.brand{text-align:center;margin-bottom:24px}
.brand h1{margin:0;color:var(--primary)}
.brand p{color:#666}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.top{height:8px;background:var(--primary)}
.section{padding:24px;border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
h3{margin:0 0 8px}
p{color:#666;margin:0 0 16px}
label{display:block;font-weight:600;margin-bottom:6px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px}
textarea{min-height:100px}
.option{margin-bottom:12px}
button{background:var(--primary);color:#fff;border:none;padding:14px 18px;border-radius:8px;font-weight:700;cursor:pointer}
.note{background:#fff4f4;border-left:4px solid var(--primary);padding:14px;border-radius:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style>
</head>
<body>

<div class="container">

<div class="brand">
<h1>Digital Janata</h1>
<p>Create a Community Poll</p>
</div>

<div class="card">

<div class="top"></div>

<div class="section">
<h3>Poll Question</h3>
<label>Question *</label>
<input type="text" placeholder="Example: Should our ward prioritize road repairs over beautification?">
</div>

<div class="section">
<h3>Description</h3>
<p>Provide context so citizens can make an informed decision.</p>
<textarea placeholder="Explain why you're creating this poll..."></textarea>
</div>

<div class="section">
<h3>Poll Options</h3>

<div class="option">
<label>Option 1 *</label>
<input type="text" placeholder="Yes">
</div>

<div class="option">
<label>Option 2 *</label>
<input type="text" placeholder="No">
</div>

<div class="option">
<label>Option 3</label>
<input type="text" placeholder="Optional">
</div>

<div class="option">
<label>Option 4</label>
<input type="text" placeholder="Optional">
</div>

</div>

<div class="section">

<h3>Who should vote?</h3>

<label>Audience *</label>

<select>
<option>My Ward</option>
<option>My City</option>
<option>Entire District</option>
<option>Entire State</option>
<option>Nationwide</option>
</select>

</div>

<div class="section">

<h3>Poll Duration</h3>

<div class="grid">

<div>
<label>Start Date</label>
<input type="date">
</div>

<div>
<label>End Date</label>
<input type="date">
</div>

</div>

</div>

<div class="section">

<h3>Visibility</h3>

<select>
<option>Public</option>
<option>Anonymous Creator</option>
</select>

</div>

<div class="section">

<h3>Supporting Material</h3>

<input type="file" multiple>

</div>

<div class="section">

<h3>Similar Polls</h3>

<div class="note">
🤖 Similar polls will be suggested before publishing to avoid duplicates.
</div>

</div>

<div class="section" style="text-align:right">

<button>Create Poll</button>

</div>

</div>

</div>

</body>
</html>
