name: 🛡️ Dependency Vulnerability Audit

on:
  push:
    branches: [ "main", "refactor/monorepo" ]
  pull_request:
    branches: [ "main", "refactor/monorepo" ]
  schedule:
    # Run weekly on Sundays
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  audit:
    name: Run Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency-Check
        # Since we use standard Maven plugins, we can run Dependency-Check via command line or integration.
        # Alternatively, we can use the official dependency-check action to scan the backend directory.
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DJP Backend'
          path: './backend/springboot'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports
