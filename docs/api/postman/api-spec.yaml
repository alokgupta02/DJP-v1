openapi: 3.0.3
info:
  title: Digital Janata Platform (DJP) API Specification
  description: OpenAPI 3.0 contract defining core citizen and authentication endpoints.
  version: 1.0.0-MVP
servers:
  - url: http://localhost:8080/djp/api/v1
    description: Local development backend server
paths:
  /auth/google:
    get:
      summary: Initiate Google OAuth2 Login
      description: Returns the OAuth2 redirect URL for Google login.
      responses:
        '200':
          description: Successful redirection URL payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    example: google
                  redirectUrl:
                    type: string
                    example: /oauth2/authorization/google
  /auth/github:
    get:
      summary: Initiate GitHub OAuth2 Login
      description: Returns the OAuth2 redirect URL for GitHub login.
      responses:
        '200':
          description: Successful redirection URL payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    example: github
                  redirectUrl:
                    type: string
                    example: /oauth2/authorization/github
  /auth/me:
    get:
      summary: Get Current Authenticated User Info
      description: Returns details of the currently active session user.
      responses:
        '200':
          description: Current user context details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized session
  /issues:
    get:
      summary: Get All Civic Issues
      description: Returns a list of all civic issues reported on the platform.
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueDTO'
    post:
      summary: Create a Civic Issue
      description: Create a new civic issue report. Requires authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateRequestDTO'
      responses:
        '201':
          description: Issue created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDTO'
        '401':
          description: Unauthorized
  /issues/{id}:
    get:
      summary: Get Issue by ID
      description: Retrieve detailed information for a specific civic issue.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDTO'
        '404':
          description: Issue not found
  /discussions:
    get:
      summary: Get All Discussions
      description: Returns a list of all civic discussions and proposals.
      responses:
        '200':
          description: List of discussions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscussionDTO'
    post:
      summary: Create a Discussion
      description: Create a new civic discussion or proposal. Requires authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionCreateRequestDTO'
      responses:
        '201':
          description: Discussion created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionDTO'
        '401':
          description: Unauthorized
  /discussions/{id}:
    get:
      summary: Get Discussion by ID
      description: Retrieve detailed information for a specific civic discussion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Discussion details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionDTO'
        '404':
          description: Discussion not found
  /polls:
    get:
      summary: Get All Polls
      description: Returns a list of all active civic polls.
      responses:
        '200':
          description: List of polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PollDTO'
    post:
      summary: Create a Poll
      description: Create a new civic poll. Requires authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollCreateRequestDTO'
      responses:
        '201':
          description: Poll created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollDTO'
        '401':
          description: Unauthorized
  /polls/{id}:
    get:
      summary: Get Poll by ID
      description: Retrieve detailed information for a specific civic poll.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Poll details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollDTO'
         '404':
          description: Poll not found
  /users/{userId}/onboarding:
    patch:
      summary: Complete User Onboarding Profile
      description: Updates profile fields during civic onboarding and marks onboarding as complete.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingUpdateRequestDTO'
      responses:
        '200':
          description: Onboarding successfully completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '401':
          description: Unauthorized
        '404':
          description: User not found
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          example: CITIZEN
        location:
          type: string
        pincode:
          type: string
        occupation:
          type: string
        bio:
          type: string
        topics:
          type: string
        onboardingCompleted:
          type: boolean
    OnboardingUpdateRequestDTO:
      type: object
      required:
        - name
        - location
        - pincode
        - privacyConsentGiven
      properties:
        name:
          type: string
        location:
          type: string
        pincode:
          type: string
        occupation:
          type: string
        bio:
          type: string
        topics:
          type: array
          items:
            type: string
        privacyConsentGiven:
          type: boolean
    IssueDTO:

      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
        status:
          type: string
        location:
          type: string
    IssueCreateRequestDTO:
      type: object
      required:
        - title
        - description
        - category
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
        location:
          type: string
    DiscussionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        votesCount:
          type: integer
        participantCount:
          type: integer
        proposalPreview:
          type: string
        proposalBadge:
          type: string
    DiscussionCreateRequestDTO:
      type: object
      required:
        - title
        - description
        - category
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        proposalPreview:
          type: string
        proposalBadge:
          type: string
    PollDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        description:
          type: string
        category:
          type: string
        optionsJson:
          type: string
        votesCount:
          type: integer
    PollCreateRequestDTO:
      type: object
      required:
        - question
        - description
        - category
      properties:
        question:
          type: string
        description:
          type: string
        category:
          type: string
        optionsJson:
          type: string
