# Spring Boot Configuration: Dummy Data Profile (application-dummy.yml)
# Active when running locally with dummy data: --spring.profiles.active=local,dummy

spring:
  datasource:
    url: jdbc:h2:mem:djpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data/users.sql
        - classpath:data/issues.sql
        - classpath:data/discussions.sql
        - classpath:data/polls.sql
