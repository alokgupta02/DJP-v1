# Spring Boot Configuration: Local Development Profile (application-local.yml)
# Active when running locally: --spring.profiles.active=local

server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/djpdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
