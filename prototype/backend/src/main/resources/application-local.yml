# Spring Boot Configuration: Local Development Profile (application-local.yml)
# Active when running locally: --spring.profiles.active=local

server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/djpdbv1?currentSchema=djp
    driver-class-name: org.postgresql.Driver
    username: djpuser
    password: "DJ@1234$$"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: djp
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: "http://localhost:5173"
  persistence:
    sql-file:
      enabled: false
