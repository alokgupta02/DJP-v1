# Spring Boot Configuration: Local Development Profile (application-local.yml)
# Active when running locally: --spring.profiles.active=local

server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:djpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations:
        - classpath:data/users.sql
        - classpath:data/issues.sql
        - classpath:data/discussions.sql
        - classpath:data/polls.sql
