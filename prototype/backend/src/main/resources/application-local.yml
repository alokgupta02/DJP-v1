# Spring Boot Configuration: Local Development Profile (application-local.yml)
# Active when running locally: --spring.profiles.active=local

server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:djpdbv1;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: PUBLIC
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174"
  persistence:
    sql-file:
      enabled: false
